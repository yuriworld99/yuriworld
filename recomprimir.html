<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recomprimir portadas</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body style="font-family:sans-serif;padding:16px">
<h1>Recomprimir portadas</h1>
<p>Entrá con tu cuenta de administrador en el sitio antes de usar esto.</p>
<button id="b3" style="padding:12px">Probar con 3</button>
<button id="bt" style="padding:12px">Recomprimir todas</button>
<pre id="log" style="white-space:pre-wrap"></pre>
<script>
const cli = window.supabase.createClient(
  "https://ifgattjcckprijvpfypw.supabase.co",
  "sb_publishable_JG7AQQ_tTJJ6SNKVjU50PQ_VNxlzTim"
);
const el = document.getElementById("log");
const log = t => { el.textContent += t + "\n"; };

function ruta(url) {
  const p = url ? url.split("/portadas/") : [];
  return p.length === 2 ? decodeURIComponent(p[1].split("?")[0]) : null;
}

async function comprimir(blob) {
  const bmp = await createImageBitmap(blob);
  const e = Math.min(1, 500 / bmp.width);
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * e);
  c.height = Math.round(bmp.height * e);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, "image/webp", 0.8));
}

async function correr(max) {
  document.getElementById("b3").disabled = true;
  document.getElementById("bt").disabled = true;
  const { data: s } = await cli.auth.getSession();
  if (!s.session) return log("Primero iniciá sesión en el sitio.");
  const { data: esAdmin } = await cli.rpc("es_administrador");
  if (esAdmin !== true) return log("Tu usuario no es administrador.");

  const rutas = new Set();
  const a = await cli.from("recomendaciones").select("portada_url");
  (a.data || []).forEach(f => { const r = ruta(f.portada_url); if (r) rutas.add(r); });
  const b = await cli.from("muro_publicaciones").select("rec_portada_url").not("rec_portada_url", "is", null);
  (b.data || []).forEach(f => { const r = ruta(f.rec_portada_url); if (r) rutas.add(r); });
  log("Portadas encontradas: " + rutas.size);

  let hechas = 0, antes = 0, despues = 0;
  for (const r of rutas) {
    if (hechas >= max) break;
    try {
      const { data: blob, error } = await cli.storage.from("portadas").download(r);
      if (error) { log("ERROR bajando " + r + ": " + error.message); continue; }
      if (blob.size < 80 * 1024) continue;
      const nuevo = await comprimir(blob);
      if (!nuevo || nuevo.size >= blob.size * 0.9) continue;
      const { error: e2 } = await cli.storage.from("portadas").update(r, nuevo, {
        contentType: "image/webp", cacheControl: "31536000"
      });
      if (e2) { log("ERROR subiendo " + r + ": " + e2.message); continue; }
      hechas++; antes += blob.size; despues += nuevo.size;
      log(hechas + ") " + r + ": " + Math.round(blob.size / 1024) + " KB -> " + Math.round(nuevo.size / 1024) + " KB");
    } catch (x) { log("ERROR en " + r + ": " + x.message); }
  }
  log("LISTO. Recomprimidas: " + hechas + ". Ahorro: " + ((antes - despues) / 1048576).toFixed(1) + " MB");
  document.getElementById("b3").disabled = false;
  document.getElementById("bt").disabled = false;
}
document.getElementById("b3").onclick = () => correr(3);
document.getElementById("bt").onclick = () => correr(100000);
</script>
</body></html>
