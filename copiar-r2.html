<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copiar a R2</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body style="font-family:sans-serif;padding:16px">
<h1>Copiar imágenes a R2</h1>
<p>Entrá con tu cuenta de administrador en el sitio antes de usar esto.</p>
<button id="b3" style="padding:12px">Probar con 3</button>
<button id="bt" style="padding:12px">Copiar todas</button>
<pre id="log" style="white-space:pre-wrap"></pre>
<script>
const WORKER = "https://subir-img.yuriworld-avisos.workers.dev";
const cli = window.supabase.createClient(
  "https://ifgattjcckprijvpfypw.supabase.co",
  "sb_publishable_JG7AQQ_tTJJ6SNKVjU50PQ_VNxlzTim"
);
const el = document.getElementById("log");
const log = t => { el.textContent += t + "\n"; };

function clave(url) {
  if (!url) return null;
  const m = url.match(/\/object\/public\/([^\/]+)\/([^?]+)/);
  return m ? m[1] + "/" + decodeURIComponent(m[2].split("?")[0]) : null;
}

async function leer(tabla, columnas) {
  const out = [];
  for (let d = 0; ; d += 1000) {
    const { data, error } = await cli.from(tabla).select(columnas).range(d, d + 999);
    if (error) { log("Aviso " + tabla + ": " + error.message); break; }
    out.push(...data);
    if (data.length < 1000) break;
  }
  return out;
}

async function correr(max) {
  document.getElementById("b3").disabled = true;
  document.getElementById("bt").disabled = true;
  const { data: s } = await cli.auth.getSession();
  if (!s.session) return log("Primero iniciá sesión en el sitio.");
  const token = s.session.access_token;
  const { data: esAdmin } = await cli.rpc("es_administrador");
  if (esAdmin !== true) return log("Tu usuario no es administrador.");

  const claves = new Set();
  const add = u => { const k = clave(u); if (k) claves.add(k); };
  (await leer("recomendaciones", "portada_url")).forEach(f => add(f.portada_url));
  (await leer("profiles", "avatar_url")).forEach(f => add(f.avatar_url));
  (await leer("profiles", "banner_url")).forEach(f => add(f.banner_url));
  (await leer("muro_publicaciones", "imagen_url, rec_portada_url")).forEach(f => { add(f.imagen_url); add(f.rec_portada_url); });

  const lista = Array.from(claves);
  log("Imágenes encontradas: " + lista.length);

  let hechas = 0, errores = 0, bytes = 0, i = 0;
  async function trabajador() {
    while (i < lista.length && hechas + errores < max) {
      const k = lista[i++];
      try {
        const partes = k.split("/");
        const pub = "https://ifgattjcckprijvpfypw.supabase.co/storage/v1/object/public/" +
          partes.map(encodeURIComponent).join("/");
        const r = await fetch(pub);
        if (!r.ok) throw new Error("bajada " + r.status);
        const blob = await r.blob();
        const up = await fetch(WORKER + "/" + partes.map(encodeURIComponent).join("/"), {
          method: "PUT",
          headers: { Authorization: "Bearer " + token, "Content-Type": blob.type || "image/jpeg" },
          body: blob
        });
        if (!up.ok) throw new Error("subida " + up.status + " " + (await up.text()));
        hechas++; bytes += blob.size;
        if (hechas <= 5 || hechas % 25 === 0) log(hechas + ") " + k + " (" + Math.round(blob.size / 1024) + " KB)");
      } catch (x) { errores++; log("ERROR " + k + ": " + x.message); }
    }
  }
  await Promise.all([trabajador(), trabajador(), trabajador(), trabajador()]);
  log("LISTO. Copiadas: " + hechas + ". Errores: " + errores + ". Total: " + (bytes / 1048576).toFixed(1) + " MB");
  document.getElementById("b3").disabled = false;
  document.getElementById("bt").disabled = false;
}
document.getElementById("b3").onclick = () => correr(3);
document.getElementById("bt").onclick = () => correr(100000);
</script>
</body></html>
