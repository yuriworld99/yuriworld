<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
  (function(){try{var t=localStorage.getItem("tema");
  if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
  document.documentElement.dataset.theme=t;}catch(e){}})();
  </script>
  <title>Editar recomendación - YuriWorld</title>
  <link rel="stylesheet" href="css/style.css?v=5">
  <link rel="stylesheet" href="css/formularios.css?v=2">
  <link rel="stylesheet" href="css/publicar.css?v=3">
  <link rel="stylesheet" href="css/insignias.css?v=6">
  <link rel="stylesheet" href="css/anilist.css?v=2">
</head>
<body>
  <main class="caja-formulario ancha">
    <h1>Editar recomendación</h1>
    <p id="estado-carga">Cargando...</p>

    <form id="form-editar" hidden>
      <label for="seccion">Sección</label>
      <select id="seccion" class="yw-select">
        <option value="lecturas">Lecturas (manga, manhwa, manhua, webtoon y novela ligera)</option>
        <option value="videojuegos">Videojuegos Yuri</option>
        <option value="peliculas">Películas Yuri</option>
        <option value="oneshot">OneShot</option>
        <option value="doujin">Doujin</option>
        <option value="fanart">Fanart</option>
      </select>

      <p id="aviso-seccion" class="aviso-seccion" hidden></p>

      <div id="buscador-anilist"></div>

      <label for="titulo">Título</label>
      <input type="text" id="titulo" maxlength="120" required>

      <label for="autor" id="etiqueta-autor">Autor/a</label>
      <input type="text" id="autor" maxlength="120" required>

      <label for="otros-titulos">Otros títulos (opcional, uno por línea: en inglés, japonés, romaji…)</label>
      <textarea id="otros-titulos" maxlength="1500" style="min-height: 90px;"></textarea>

      <label for="sinopsis" id="etiqueta-sinopsis">Sinopsis</label>
      <textarea id="sinopsis" maxlength="2000" required></textarea>

      <div id="campos-lectura">
      <label for="tipo">Tipo de obra</label>
        <select id="tipo" class="yw-select" required></select>

        <label for="estado">Estado</label>
        <select id="estado" class="yw-select" required></select>
      </div>

      <label class="yw-18" for="es18">
        <input type="checkbox" id="es18" style="width: auto; margin-top: 3px;">
        <span>Es una obra +18 (contenido para mayores de 18 años)</span>
      </label>

      <p class="etiqueta">Géneros</p>
      <div id="lista-generos" class="generos"></div>

      <label for="portada">Cambiar la portada (opcional, JPG, PNG o WEBP, máximo 2 MB)</label>
      <input type="file" id="portada" accept="image/jpeg,image/png,image/webp">
      <img id="vista-previa" class="vista-previa" alt="Portada de la recomendación" hidden>

      <button type="submit" id="boton-guardar" class="boton">Guardar cambios</button>
    </form>

    <p id="mensaje" class="mensaje"></p>
    <p class="enlace-secundario"><a id="enlace-volver" href="index.html">Cancelar y volver</a></p>
  </main>

  <button id="btn-tema" type="button"></button>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/generos.js?v=3"></script>
  <script src="js/anilist.js?v=1"></script>
  <script src="js/editar-recomendacion.js?v=4"></script>
  <script src="js/tema.js"></script>
</body>
</html>
