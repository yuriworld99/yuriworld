<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
  (function(){try{var t=localStorage.getItem("tema");
  if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
  document.documentElement.dataset.theme=t;}catch(e){}})();
  </script>
  <title>Publicación - YuriWorld</title>
  <link rel="stylesheet" href="css/style.css?v=5">
  <link rel="stylesheet" href="css/muro.css?v=2">
  <link rel="stylesheet" href="css/publicacion.css?v=2">
  <link rel="stylesheet" href="css/respuestas.css?v=2">
</head>
<body>
  <main class="detalle-publicacion">
    <a href="foro.html" class="enlace-volver">← Volver a la comunidad</a>

    <p id="estado-detalle">Cargando...</p>

    <div id="contenido" hidden>
      <article id="publicacion" class="post"></article>

      <section>
        <h2 class="titulo-respuestas">Comentarios</h2>

        <div id="compositor-respuesta" class="compositor-respuesta" hidden>
          <div id="avatar-respuesta"></div>
          <textarea id="texto-respuesta" maxlength="1000" rows="2" placeholder="Escribí tu comentario..."></textarea>
          <button type="button" id="boton-responder" class="boton-publicar">Comentar</button>
        </div>

        <p id="aviso-respuesta" class="muro-aviso" hidden>
          Para comentar necesitás
          <a href="iniciar-sesion.html">iniciar sesión</a> o
          <a href="registro.html">crear una cuenta</a>.
        </p>

        <p id="mensaje-respuesta" class="muro-mensaje"></p>
        <div id="lista-respuestas"></div>
      </section>
    </div>
  </main>

  <div id="aviso-flotante" class="aviso-flotante" hidden></div>

  <button id="btn-tema" type="button"></button>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/publicacion.js?v=4"></script>
  <script src="js/comentarios-id.js?v=2"></script>
  <script src="js/tema.js"></script>
</body>
</html>
