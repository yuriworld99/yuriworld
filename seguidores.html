<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
  (function(){try{var t=localStorage.getItem("tema");
  if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
  document.documentElement.dataset.theme=t;}catch(e){}})();
  </script>
  <title>Seguidores - YuriWorld</title>
  <link rel="stylesheet" href="css/style.css?v=5">
  <link rel="stylesheet" href="css/seguidores.css?v=2">
</head>
<body>
  <main class="seg-pagina">
    <p id="estado-seguidores">Cargando...</p>

    <div id="contenido-seguidores" hidden>
      <h1 id="titulo-seguidores"></h1>
      <nav class="seg-pestanas">
        <button type="button" id="pestana-seguidores" class="seg-pestana activa">Seguidores</button>
        <button type="button" id="pestana-siguiendo" class="seg-pestana">Siguiendo</button>
      </nav>
      <section id="lista-seguidores" class="seg-lista">Cargando...</section>
    </div>
  </main>

  <button id="btn-tema" type="button"></button>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/seguidores-lista.js"></script>
  <script src="js/tema.js"></script>
</body>
</html>
