<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta - YuriWorld</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/formularios.css">
</head>
<body>
  <main class="caja-formulario">
    <h1>Crear cuenta</h1>
    <form id="form-registro">
      <label for="username">Nombre de usuario</label>
      <input type="text" id="username" minlength="3" maxlength="20" autocomplete="username" required>

      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email" required>

      <label for="password">Contraseña (mínimo 8 caracteres)</label>
      <input type="password" id="password" autocomplete="new-password" required>

      <label for="acepto" style="display: flex; align-items: flex-start; gap: 10px; margin-top: 14px; font-size: 0.92rem; font-weight: normal;">
        <input type="checkbox" id="acepto" style="width: auto; margin-top: 4px;" required>
        <span>Tengo al menos 13 años y acepto los <a href="legal.html#terminos" target="_blank">términos</a>, la <a href="legal.html#privacidad" target="_blank">privacidad</a> y las <a href="legal.html#reglas" target="_blank">reglas de la comunidad</a>.</span>
      </label>

      <button type="submit" id="boton-registro" class="boton">Crear cuenta</button>
    </form>
    <p id="mensaje" class="mensaje"></p>
    <p class="enlace-secundario">¿Ya tenés cuenta? <a href="iniciar-sesion.html">Iniciar sesión</a></p>
    <p class="enlace-secundario"><a href="index.html">Volver al inicio</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/registro.js"></script>
</body>
      </html>
